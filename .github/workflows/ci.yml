# CI for the AI Compliance Runtime: tests, dependency audit, Docker build.
# The runtime is pure-Python (no ML/LLM deps, ADR-013), so there is no torch
# install anywhere here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - name: Install deps from lockfile (C-41, C-44)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
      - name: Install dev/test deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q -m "not llm" --tb=short

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install project deps from lockfile
        run: pip install -r requirements.lock
      - name: Run pip-audit (fail on any known advisory)
        # PYSEC-2026-3447 (setuptools sdist/MANIFEST.in) is inapplicable:
        # we publish no packages and build no sdists. See docs/security.md.
        run: pip-audit --strict --ignore-vuln PYSEC-2026-3447

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Build image
        run: docker build -t compliance-runtime:ci .
      - name: Verify image starts
        run: |
          docker run --rm -d --name cr -p 8501:8501 compliance-runtime:ci
          sleep 20
          curl -fsS http://localhost:8501/ || (docker logs cr; docker stop cr; exit 1)
          docker stop cr
