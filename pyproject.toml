[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-runtime"
version = "0.1.0"
description = "Open-source runtime that enforces policy on AI agent tool calls and produces cryptographically-verifiable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vickky Whyte", email = "vickkywhyte@gmail.com" }]

# Runtime dependencies (free-tier stack; NO LLM SDKs — ADR-013).
dependencies = [
    "pydantic>=2.8",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ulid-py>=1.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "plotly>=5.20",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "pip-tools>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require an LLM (never used; ADR-013 — runtime has no LLM in the critical path)",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
